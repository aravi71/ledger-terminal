services:
  ledger:
    build: .
    env_file: .env
    environment:
      LEDGER_HOST: 0.0.0.0
      LEDGER_DATA_DIR: /data
    volumes:
      - ledger-data:/data
    # Only reachable from the server itself. Put Caddy/nginx (HTTPS) in front;
    # see docs/HANDBOOK.md -> Deploying to a server.
    ports:
      - "127.0.0.1:3002:3002"
    restart: unless-stopped

volumes:
  ledger-data:
